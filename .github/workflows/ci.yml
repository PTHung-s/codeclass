name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codeclass-server:
    name: CodeClass Server (Typecheck, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --schema prisma/schema.prisma
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  codeclass-client:
    name: CodeClass Client (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  meeting-apps:
    name: Meeting Server & Client (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix meeting/server ci && npm --prefix meeting/server run build
      - run: npm --prefix meeting/client ci && npm --prefix meeting/client run build
