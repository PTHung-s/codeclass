<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Viền trắng die-cut -->
    <path d="M22,30 C35,10 93,10 106,30 C118,50 115,90 95,110 C70,122 40,118 25,105 C10,85 10,50 22,30 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" stroke-linejoin="round"/>
    <!-- Đầu nhân vật Stonks (Mannequin) -->
    <ellipse cx="55" cy="52" rx="30" ry="38" fill="#cbd5e1"/>
    <ellipse cx="58" cy="50" rx="27" ry="34" fill="#e2e8f0"/>
    <!-- Mũi mannequin đặc trưng -->
    <polygon points="56,44 64,56 54,58" fill="#94a3b8"/>
    <!-- Mũi tên Stonks cam bay vút lên góc phải -->
    <path d="M24,96 L50,75 L68,85 L108,35" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Đầu mũi tên -->
    <polygon points="108,35 94,36 106,48" fill="#ea580c"/>
    <polygon points="108,35 94,36 106,48" stroke="#ffffff" stroke-width="2"/>
    <!-- Text STONKS -->
    <text x="64" y="118" font-family="sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">STONKS</text>
  </g>
</svg>
