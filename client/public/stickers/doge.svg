    <path d="M35,60 C35,85 45,104 64,104 C83,104 93,85 93,60 C80,72 48,72 35,60 Z" fill="#fef3c7"/>
    <!-- Mắt Doge phán xét -->
    <ellipse cx="45" cy="54" rx="5" ry="6" fill="#1e293b"/>
    <ellipse cx="83" cy="54" rx="5" ry="6" fill="#1e293b"/>
    <circle cx="43" cy="52" r="1.5" fill="#ffffff"/>
    <circle cx="81" cy="52" r="1.5" fill="#ffffff"/>
    <!-- Mũi và mồm -->
    <polygon points="64,68 59,62 69,62" fill="#0f172a"/>
    <path d="M57,70 Q64,76 71,70" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lông mày nghi ngờ -->
    <path d="M38,44 Q46,42 50,46" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M90,44 Q82,42 78,46" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Text meme -->
    <text x="64" y="124" font-family="sans-serif" font-weight="900" font-size="10" fill="#f59e0b" text-anchor="middle">MUCH WOW</text>
  </g>
</svg>
