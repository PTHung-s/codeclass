<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Viền trắng phong cách Sticker die-cut -->
  <g filter="url(#shadow)">
    <path d="M24,40 C14,15 36,8 44,24 C52,18 76,18 84,24 C92,8 114,15 104,40 C118,65 110,105 64,115 C18,105 10,65 24,40 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" stroke-linejoin="round"/>
    <!-- Thân mặt Shiba vàng cam -->
    <path d="M27,42 C18,20 36,14 43,27 C53,22 75,22 85,27 C92,14 110,20 101,42 C114,64 106,100 64,110 C22,100 14,64 27,42 Z" fill="#f59e0b"/>
